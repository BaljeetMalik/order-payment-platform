apiVersion: batch/v1
kind: Job
metadata:
  name: order-service-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: migrate
          image: ghcr.io/baljeetmalik/order-service       # same tag as the Deployment (kustomize sets both)
          command: ["python", "-c", "from app.db.migrations import run_migrations; run_migrations()"]
          envFrom:
            - secretRef: { name: order-service-env }
          env:
            - { name: KAFKA_ENABLED, value: "false" }