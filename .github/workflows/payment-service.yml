name: payment-service

on:
  push:
    branches: [main]
    paths:
      - "payment-service/**"
      - ".github/workflows/payment-service.yml"
  pull_request:
    paths:
      - "payment-service/**"
      - ".github/workflows/payment-service.yml"

env:
  SERVICE: payment-service
  IMAGE: ghcr.io/baljeetmalik/payment-service

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}   # per service, so the two pipelines don't cancel each other
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-service
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paymentdb_test          # tests/conftest.py uses "<DATABASE_URL db>_test"
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/paymentdb
      KAFKA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: payment-service
          enable-cache: true
          cache-dependency-glob: payment-service/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: payment-service
          push: true
          platforms: linux/amd64,linux/arm64      # kind on Apple Silicon runs arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=payment-service  # separate build cache per service
          cache-to: type=gha,mode=max,scope=payment-service

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write                               # push the tag bump to this same repo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: imranismail/setup-kustomize@v2
      - name: Bump image tag in platform-gitops
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd "platform-gitops/services/$SERVICE"
          kustomize edit set image "$IMAGE:$TAG"
          if git diff --quiet; then echo "already at $TAG"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy $SERVICE $TAG"
          # Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 3))
          done
          exit 1
